<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="#c4893a"/>

  <!-- Blue robe (bottom) -->
  <path d="M10 64 Q10 52 32 52 Q54 52 54 64Z" fill="#2563eb"/>
  <!-- Gold trim on robe -->
  <path d="M16 52 Q32 49 48 52" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Face -->
  <circle cx="32" cy="37" r="13" fill="#f5cfaa"/>

  <!-- Turban base -->
  <ellipse cx="32" cy="24" rx="19" ry="11" fill="white"/>
  <!-- Turban fold -->
  <ellipse cx="32" cy="27" rx="14" ry="6.5" fill="#e8e8e8"/>
  <!-- Gold ornament center -->
  <circle cx="32" cy="23" r="3.5" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>

  <!-- Red feather/plume -->
  <path d="M48 20 C52 13 57 7 54 3 C51 7 48 14 47 19 C50 13 53 8 54 3 Q51 9 48 20Z" fill="#dc2626"/>

  <!-- Black hair (peek under turban) -->
  <path d="M15 28 Q14 35 19 38" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M49 28 Q50 35 45 38" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="27" cy="37" r="2.2" fill="#1a1a1a"/>
  <circle cx="37" cy="37" r="2.2" fill="#1a1a1a"/>
  <!-- Eye shine -->
  <circle cx="28" cy="36" r="0.7" fill="white"/>
  <circle cx="38" cy="36" r="0.7" fill="white"/>

  <!-- Mouth (slight smile) -->
  <path d="M28 43 Q32 46.5 36 43" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
